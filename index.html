<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金沢さんぽメモ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#26241f; --muted:#6f6a5e; --faint:#a39a89;
  --line:#e9e2d2; --bg:#faf7f0; --soft:#f4efe2;
  --accent:#2f5aa8; --accent-soft:#e8effa;
  --gold:#b3862c; --gold-soft:#f6ecce;
  --plum:#9c4a63; --plum-soft:#f9e8ec;
  --tea:#56714c; --tea-soft:#ebf1e4;
  --green:#2e7d32;
  --shadow:0 1px 2px rgba(90,70,20,.05),0 4px 16px rgba(90,70,20,.07);
}
*{box-sizing:border-box}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;margin:0;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 56px}
header.site{background:linear-gradient(120deg,#fdf3d8 0%,#f6e7ef 55%,#e8effa 100%);border:1px solid var(--line);border-radius:16px;padding:18px 20px 14px;margin-bottom:18px}
h1{font-size:1.55em;margin:0;letter-spacing:.04em;font-weight:700}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:.88em;margin:4px 0 0}
.note{color:var(--faint);font-size:.8em;margin:6px 0 0}
.memo{background:var(--gold-soft);border:1px solid #eadfae;border-radius:14px;padding:16px 18px;margin:0 0 20px}
.memo h2{font-size:1em;margin:0 0 6px;font-weight:700}
.memo ul{margin:0;padding-left:1.25em;color:#3c424b}
#map{height:340px;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 6px;z-index:0}
.mapnote{color:var(--faint);font-size:.78em;margin:0 0 14px}
/* sticky: search + two small buttons only */
.toolbar{position:sticky;top:0;background:rgba(250,247,240,.96);backdrop-filter:blur(6px);padding:10px 0;z-index:500;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.toolbar input[type=search]{flex:1;padding:10px 13px;font-size:1em;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;min-width:0}
.toolbar input[type=search]:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.tbtn{flex:none;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:.88em;color:#3c424b}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn .n{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:.82em;margin-left:4px}
/* filter panel: NOT sticky, scrolls away */
.panel{border:1px solid var(--line);border-radius:14px;padding:6px 14px 12px;margin:12px 0 0;background:#fff}
.panel[hidden]{display:none}
.rowlabel{font-size:.74em;color:var(--faint);margin:10px 0 4px;letter-spacing:.1em;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:.86em;color:#3c424b}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.count{color:var(--muted);font-size:.84em;margin:16px 2px 6px}
/* card view: 2 columns on wide screens */
#list.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
#list.grid .card{margin:0}
@media (max-width:759px){ #list.grid{grid-template-columns:1fr} }
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:16px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.card.cat-amami{border-top-color:var(--plum)}
.card.cat-jitsuyo{border-top-color:var(--tea)}
.rowitem.cat-amami{border-left:4px solid var(--plum)}
.rowitem.cat-jitsuyo{border-left:4px solid var(--tea)}
.rowitem.cat-gohan{border-left:4px solid var(--gold)}
.card h2{font-size:1.14em;margin:0 0 2px;font-weight:700}
.card img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin:0 0 12px;display:block}
.meta{color:var(--muted);font-size:.85em;margin:2px 0 8px}
.meta a{color:var(--accent);text-decoration:none}
.meta a:hover{text-decoration:underline}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:2px 2px 2px 0;font-size:.79em;color:#57503f}
.tag.t-cat{background:var(--gold-soft);border-color:#eadfae;color:#7c5c14;font-weight:600}
.cat-amami .tag.t-cat{background:var(--plum-soft);border-color:#eecdd6;color:#83344d}
.cat-jitsuyo .tag.t-cat{background:var(--tea-soft);border-color:#d3dfc6;color:#415c38}
.card h3{font-size:.88em;margin:13px 0 2px;font-weight:700}
.card p{margin:2px 0;color:#33383f}
.caution{color:#b3261e;font-size:.9em}
.cardfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.flags button,.maplink{padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:.85em;color:#3c424b;text-decoration:none}
.flags button.on{background:var(--green);border-color:var(--green);color:#fff}
.flags button.on.visited{background:#5b636e;border-color:#5b636e}
.maplink:hover{border-color:var(--accent);color:var(--accent)}
/* compact list view */
.rowitem{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;box-shadow:var(--shadow)}
.rowitem summary{cursor:pointer;padding:11px 14px;display:flex;gap:12px;align-items:center;list-style:none}
.rowitem summary::-webkit-details-marker{display:none}
.rowitem summary img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.rowitem .rname{font-weight:700}
.rowitem .rmeta{color:var(--muted);font-size:.82em}
.rowitem .rbody{padding:0 14px 13px}
.rowitem .rbody p{margin:2px 0;color:#33383f}
.rowitem .rbody h3{font-size:.86em;margin:10px 0 2px}
.empty{color:var(--muted);text-align:center;padding:36px 0}
#totop{position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);cursor:pointer;font-size:1.05em;color:#3c424b;z-index:600}
footer{color:var(--faint);font-size:.78em;text-align:center;margin-top:28px}
.leaflet-popup-content{font-family:inherit;line-height:1.5}
@media (max-width:560px){ .wrap{padding:20px 14px 44px} #map{height:280px} .card{padding:15px} .tbtn{padding:9px 10px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>金沢<span>さんぽ</span>メモ</h1>
    <p class="sub" id="updated"></p>
    <p class="note">閲覧専用です。追加・編集はスペース「金沢さんぽメモ」が本体で、こちらはその写しです。リンクの追加・調査（Inbox）はありません。行きたい／行ったの切り替えはこの端末にだけ保存されます。</p>
  </header>
  <section class="memo" id="memo"></section>
  <div id="map"></div>
  <p class="mapnote">ピンは住所が判明しているスポットです。一部の店（支店が特定できない店・住所に諸説ある店・すしべん）は概略位置になっています。店名不明の店と、住所未調査の店は地図に出ていません。</p>
  <div class="toolbar">
    <input id="q" type="search" placeholder="店名・メモ・タグで検索（空白で区切るとOR）">
    <button class="tbtn" id="filterbtn">絞り込み<span class="n" id="filternum" hidden>0</span></button>
    <button class="tbtn" id="viewbtn">リスト表示</button>
  </div>
  <div class="panel" id="panel" hidden>
    <div class="rowlabel">カテゴリ</div><div class="chips" id="chips-cat"></div>
    <div class="rowlabel">エリア</div><div class="chips" id="chips-area"></div>
    <div class="rowlabel">ジャンル（複数選ぶとOR検索）</div><div class="chips" id="chips-genre"></div>
    <div class="rowlabel">条件（複数選ぶとOR検索）</div><div class="chips" id="chips-cond"></div>
    <div class="rowlabel">フラグ</div><div class="chips" id="chips-flag"></div>
  </div>
  <div class="count" id="count"></div>
  <div id="list" class="grid"></div>
  <footer>金沢さんぽメモ — 静的ミラー版</footer>
</div>
<button id="totop" title="トップへ戻る">↑</button>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let data=null, fCat=null, fArea=null, fFlag=null;
const fGenre=new Set(), fCond=new Set();
let view=localStorage.getItem('kanazawa-view')||'grid';
let flags=JSON.parse(localStorage.getItem('kanazawa-flags')||'{}');
function saveFlags(){localStorage.setItem('kanazawa-flags',JSON.stringify(flags));}
function flagOf(i){const f=flags[i.id]||{};return {want:f.want!==undefined?f.want:i.wantToGo, visited:f.visited!==undefined?f.visited:i.visited};}
function catClass(c){return c==='甘味'?'cat-amami':(c==='実用'?'cat-jitsuyo':'cat-gohan');}
function tagsHtml(i){const tags=[i.category,i.area,...i.genres,...i.conditions].filter(Boolean);return tags.map((t,ix)=>`<span class="tag${ix===0?' t-cat':''}">${t}</span>`).join('');}
function activeCount(){return [fCat,fArea,fFlag].filter(Boolean).length+fGenre.size+fCond.size;}
function chipRow(el, values, set){
  el.innerHTML='<button data-v="">すべて</button>'+values.map(v=>`<button data-v="${v}">${v}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{set(b.dataset.v||null);el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));syncFilterBadge();render();});
  el.querySelector('button').classList.add('on');
}
function chipMulti(el, values, set){
  el.innerHTML=values.map(v=>`<button data-v="${v}">${v}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;set.has(v)?set.delete(v):set.add(v);b.classList.toggle('on',set.has(v));syncFilterBadge();render();});
}
function syncFilterBadge(){const n=activeCount(),el=document.getElementById('filternum');el.hidden=n===0;el.textContent=n;}
async function load(){
  const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); data=await r.json();
  if(!data.memo||!data.items){document.getElementById('list').innerHTML='<p class="empty">データを読み込めませんでした。再読み込みしてください。</p>';return;}
  document.getElementById('updated').textContent='更新 '+data.updated;
  const m=data.memo;
  document.getElementById('memo').innerHTML=`<h2>${m.title}</h2><ul>${m.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
  initMap();
  chipRow(document.getElementById('chips-cat'),[...new Set(data.items.map(i=>i.category))],v=>fCat=v);
  chipRow(document.getElementById('chips-area'),[...new Set(data.items.map(i=>i.area).filter(Boolean))],v=>fArea=v);
  chipMulti(document.getElementById('chips-genre'),[...new Set(data.items.flatMap(i=>i.genres))],fGenre);
  chipMulti(document.getElementById('chips-cond'),[...new Set(data.items.flatMap(i=>i.conditions))],fCond);
  chipRow(document.getElementById('chips-flag'),['行きたい','行った'],v=>fFlag=v);
  document.getElementById('q').addEventListener('input',render);
  const panel=document.getElementById('panel');
  document.getElementById('filterbtn').onclick=()=>{panel.hidden=!panel.hidden;};
  const vb=document.getElementById('viewbtn');
  const syncViewBtn=()=>{vb.textContent=view==='grid'?'リスト表示':'カード表示';};
  vb.onclick=()=>{view=view==='grid'?'list':'grid';localStorage.setItem('kanazawa-view',view);syncViewBtn();render();};
  syncViewBtn();
  document.getElementById('totop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function initMap(){
  const pts=data.items.filter(i=>i.lat&&i.lng);
  if(!pts.length||typeof L==='undefined'){document.getElementById('map').style.display='none';return;}
  const map=L.map('map');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  const bounds=[];
  pts.forEach(i=>{
    bounds.push([i.lat,i.lng]);
    L.marker([i.lat,i.lng]).addTo(map).bindPopup(`<strong>${i.name}</strong><br>${[i.area,i.genres.join('・')].filter(Boolean).join(' ／ ')}<br><a href="#spot-${i.id}">カードを見る</a>`);
  });
  map.fitBounds(bounds,{padding:[28,28]});
}
function bodyHtml(i){
  return `${i.postNote?`<h3>メモ</h3><p>${i.postNote}</p>`:''}
  ${i.photoFindings?`<h3>写真から分かったこと</h3><p>${i.photoFindings}</p>`:''}
  ${i.supplement?`<h3>補足</h3><p>${i.supplement}</p>`:''}
  ${i.caution?`<p class="caution">注意：${i.caution}</p>`:''}`;
}
function footHtml(i,fl){
  const gq=encodeURIComponent(i.name+' 金沢');
  return `<div class="cardfoot flags">
    <button data-id="${i.id}" data-k="want" class="${fl.want?'on':''}">行きたい</button>
    <button data-id="${i.id}" data-k="visited" class="visited ${fl.visited?'on':''}">行った</button>
    <a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${gq}" target="_blank" rel="noopener">Googleマップで開く</a>
  </div>`;
}
function render(){
  const words=(document.getElementById('q').value||'').trim().split(/\s+/).filter(Boolean);
  const list=data.items.filter(i=>{
    const fl=flagOf(i);
    const hay=i.name+i.postNote+i.photoFindings+i.supplement+i.category+i.area+i.genres.join(' ')+i.conditions.join(' ');
    return (!fCat||i.category===fCat)&&(!fArea||i.area===fArea)
      &&(fGenre.size===0||[...fGenre].some(g=>i.genres.includes(g)))&&(fCond.size===0||[...fCond].some(c=>i.conditions.includes(c)))
      &&(!fFlag||(fFlag==='行きたい'?fl.want:fl.visited))
      &&(words.length===0||words.some(w=>hay.includes(w)));
  });
  document.getElementById('count').textContent=list.length+' 件';
  const box=document.getElementById('list');
  box.className=view==='grid'?'grid':'';
  if(view==='grid'){
    box.innerHTML=list.map(i=>{
      const fl=flagOf(i);
      return `<article class="card ${catClass(i.category)}" id="spot-${i.id}">
        ${i.images.map(s=>`<img src="${s}" alt="" loading="lazy">`).join('')}
        <h2>${i.name}</h2>
        <div class="meta">出典：<a href="${i.sourceUrl}" target="_blank" rel="noopener">${i.sourceAuthor} の投稿</a></div>
        <div>${tagsHtml(i)}</div>
        ${bodyHtml(i)}${footHtml(i,fl)}
      </article>`;}).join('')||'<p class="empty">該当するスポットがありません</p>';
  }else{
    box.innerHTML=list.map(i=>{
      const fl=flagOf(i);
      const tags=[i.category,i.area,...i.genres,...i.conditions].filter(Boolean);
      return `<details class="rowitem ${catClass(i.category)}" id="spot-${i.id}">
        <summary>${i.images.length?`<img src="${i.images[0]}" alt="" loading="lazy">`:''}<span><span class="rname">${i.name}</span><br><span class="rmeta">${tags.join(' ／ ')}</span></span></summary>
        <div class="rbody">
          <div class="meta">出典：<a href="${i.sourceUrl}" target="_blank" rel="noopener">${i.sourceAuthor} の投稿</a></div>
          ${i.images.map(s=>`<img src="${s}" alt="" loading="lazy" style="width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin:0 0 10px">`).join('')}
          ${bodyHtml(i)}${footHtml(i,fl)}
        </div>
      </details>`;}).join('')||'<p class="empty">該当するスポットがありません</p>';
  }
  box.querySelectorAll('.flags button').forEach(b=>b.onclick=e=>{
    e.preventDefault();
    const id=b.dataset.id, k=b.dataset.k, item=data.items.find(x=>x.id==id), cur0=flagOf(item);
    const cur=flags[id]||{}; cur[k]=!(k==='want'?cur0.want:cur0.visited);
    flags[id]=cur; saveFlags(); render();
  });
}
load();
</script>
</body>
</html>
